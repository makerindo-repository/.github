<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0A1122"/>
      <stop offset="100%" stop-color="#0E172B"/>
    </linearGradient>

    <!-- Top & Center Accent Gradients -->
    <linearGradient id="topLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#00ADD8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162238" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D1526" stop-opacity="0.95"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#10507C" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>

    <!-- Symmetrical Modular Grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', Menlo, monospace; }
    
    .corp-title { font-size: 34px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; text-anchor: middle; }
    .corp-tagline { font-size: 15px; font-weight: 600; fill: #00ADD8; letter-spacing: 0.5px; text-anchor: middle; text-transform: uppercase; }
    .corp-desc { font-size: 12.5px; fill: #94A3B8; font-weight: 400; text-anchor: middle; }
    
    .cat-badge-text { font-size: 10px; font-weight: 700; fill: #38BDF8; letter-spacing: 1px; text-anchor: middle; text-transform: uppercase; }
    .iso-badge-text { font-size: 10px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
    
    .card-title { font-size: 13px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.2px; }
    .card-sub { font-size: 9.5px; font-weight: 500; fill: #64748B; }
    .card-detail { font-size: 10.5px; fill: #94A3B8; font-weight: 400; }
    .card-metric { font-size: 10.5px; font-weight: 600; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#centerGlow)"/>

  <!-- Outer Architectural Framing -->
  <rect x="0.5" y="0.5" width="1199" height="359" fill="none" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Symmetrical Header Accent Bar -->
  <rect x="0" y="0" width="1200" height="3.5" fill="url(#topLineGrad)"/>

  <!-- ==================== CENTER SECTION: EXECUTIVE HERO IDENTITY ==================== -->
  <!-- Center Axis: X = 600 -->
  <g transform="translate(600, 24)" class="font-base">
    
    <!-- Top Pill Badge (Centered: width=260, x=-130) -->
    <rect x="-130" y="0" width="260" height="24" rx="12" fill="#0E1A2E" stroke="#0284C7" stroke-width="1"/>
    <circle cx="-114" cy="12" r="4" fill="#10B981"/>
    <text x="6" y="15.5" class="cat-badge-text font-mono">ENTERPRISE R&amp;D LAB · EST. 2019</text>

    <!-- Company Name (Centered) - No PT -->
    <text x="0" y="56" class="corp-title">Makerindo Prima Solusi</text>

    <!-- Corporate Tagline (Centered) -->
    <text x="0" y="80" class="corp-tagline font-mono">Build Solution without Exception</text>

    <!-- Scope Description (Centered) -->
    <text x="0" y="104" class="corp-desc">Cyber-Physical Systems · Industrial IoT · Distributed Cloud Platforms · Applied Vision AI</text>
    <text x="0" y="122" class="corp-desc" fill="#64748B" font-size="11.5">Empowering National Defense, Precision Agriculture, Smart Manufacturing, and Higher Education R&amp;D</text>

    <!-- Centered ISO Compliance Badges Row -->
    <g transform="translate(0, 136)">
      <!-- ISO 25010 (width=96, x=-222) -->
      <rect x="-222" y="0" width="96" height="22" rx="4" fill="#0A1120" stroke="#1E293B" stroke-width="1"/>
      <text x="-174" y="14.5" class="font-mono iso-badge-text">ISO 25010</text>

      <!-- ISO 27001 (width=96, x=-114) -->
      <rect x="-114" y="0" width="96" height="22" rx="4" fill="#0A1120" stroke="#1E293B" stroke-width="1"/>
      <text x="-66" y="14.5" class="font-mono iso-badge-text">ISO 27001</text>

      <!-- ISO 12207 (width=96, x=-6) -->
      <rect x="-6" y="0" width="96" height="22" rx="4" fill="#0A1120" stroke="#1E293B" stroke-width="1"/>
      <text x="42" y="14.5" class="font-mono iso-badge-text">ISO 12207</text>

      <!-- ISO 42001 (width=96, x=102) -->
      <rect x="102" y="0" width="96" height="22" rx="4" fill="#0A1120" stroke="#1E293B" stroke-width="1"/>
      <text x="150" y="14.5" class="font-mono iso-badge-text">ISO 42001</text>

      <!-- Location Indicator (width=140, x=210) -->
      <circle cx="220" cy="11" r="3.5" fill="#10B981"/>
      <text x="230" y="14.5" class="font-base" font-size="10.5" font-weight="600" fill="#10B981">Bandung, ID</text>
    </g>

  </g>

  <!-- Horizontal Symmetrical Divider -->
  <line x1="48" y1="184" x2="1152" y2="184" stroke="#1E293B" stroke-width="1"/>

  <!-- ==================== BOTTOM ROW: 4 SYMMETRICAL DIVISION CARDS ==================== -->
  <!-- Mathematical Grid: Canvas 1200px, Left/Right Margins=48px, Total Active=1104px -->
  <!-- 4 Cards x 264px = 1056px + 3 Gutters x 16px = 48px -> Exactly 1104px (Symmetric around X=600) -->
  <g transform="translate(48, 196)" class="font-base">

    <!-- Card 01: IoT & Embedded Hardware (X = 0) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="264" height="142" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="14" y="12" width="28" height="28" rx="6" fill="#0A1120" stroke="#0284C7" stroke-width="1"/>
      <path d="M22 22h12v12H22z" fill="none" stroke="#00ADD8" stroke-width="1.6"/>
      <path d="M25 19v3m6-3v3m-6 12v3m6-3v3M19 25h3m-3 6h3m12-6h3m-3 6h3" stroke="#00ADD8" stroke-width="1.6"/>
      <text x="50" y="24" class="card-title">IoT &amp; Embedded</text>
      <text x="50" y="37" class="card-sub font-mono">ESP-IDF · STM32 · LoRaWAN</text>
      
      <line x1="14" y1="48" x2="250" y2="48" stroke="#1E293B" stroke-width="1"/>
      
      <text x="14" y="68" class="card-detail">Rapid Soil Checker (RSC) · NPK</text>
      <text x="14" y="86" class="card-detail">Industrial Modbus RTU / RS-485</text>
      <text x="14" y="106" class="font-mono card-metric" fill="#00ADD8">Sub-10ms Sensor Telemetry</text>
      <text x="14" y="124" class="font-mono" font-size="9.5" fill="#10B981">● 0 Packet Loss Guarantee</text>
    </g>

    <!-- Card 02: Distributed Cloud & Web (X = 280) -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="264" height="142" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="14" y="12" width="28" height="28" rx="6" fill="#0A1120" stroke="#059669" stroke-width="1"/>
      <path d="M22 29a4.5 4.5 0 0 1 0-9 5.5 5.5 0 0 1 10-2 4.5 4.5 0 0 1 3 11H22z" fill="none" stroke="#10B981" stroke-width="1.6"/>
      <text x="50" y="24" class="card-title">Distributed Cloud</text>
      <text x="50" y="37" class="card-sub font-mono">Next.js 16 · Go 1.22 · Postgres</text>
      
      <line x1="14" y1="48" x2="250" y2="48" stroke="#1E293B" stroke-width="1"/>
      
      <text x="14" y="68" class="card-detail">High-Throughput Microservices</text>
      <text x="14" y="86" class="card-detail">Redis 7 Cluster · WebSockets</text>
      <text x="14" y="106" class="font-mono card-metric" fill="#10B981">18.6k Req/sec Concurrency</text>
      <text x="14" y="124" class="font-mono" font-size="9.5" fill="#10B981">● 99.99% High Availability</text>
    </g>

    <!-- Card 03: Mission-Critical Mobile (X = 560) -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="264" height="142" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="14" y="12" width="28" height="28" rx="6" fill="#0A1120" stroke="#D97706" stroke-width="1"/>
      <rect x="23" y="18" width="10" height="16" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
      <circle cx="28" cy="30" r="1" fill="#F59E0B"/>
      <text x="50" y="24" class="card-title">Mission Mobile</text>
      <text x="50" y="37" class="card-sub font-mono">Flutter 3.x · Dart · SQLite DTN</text>
      
      <line x1="14" y1="48" x2="250" y2="48" stroke="#1E293B" stroke-width="1"/>
      
      <text x="14" y="68" class="card-detail">Anti-Mock GPS Geofence Engine</text>
      <text x="14" y="86" class="card-detail">Cadet &amp; Fleet Real-Time Tracker</text>
      <text x="14" y="106" class="font-mono card-metric" fill="#F59E0B">Store-and-Forward Offline Sync</text>
      <text x="14" y="124" class="font-mono" font-size="9.5" fill="#10B981">● Zero Data Loss Concurrency</text>
    </g>

    <!-- Card 04: Applied AI & Vision (X = 840) -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="264" height="142" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="14" y="12" width="28" height="28" rx="6" fill="#0A1120" stroke="#7C3AED" stroke-width="1"/>
      <circle cx="28" cy="24" r="4" fill="none" stroke="#A855F7" stroke-width="1.6"/>
      <path d="M21 32c0-3.5 3.5-5.5 7-5.5s7 2 7 5.5" fill="none" stroke="#A855F7" stroke-width="1.6"/>
      <text x="50" y="24" class="card-title">Applied AI &amp; Vision</text>
      <text x="50" y="37" class="card-sub font-mono">SigLIP ViT · PyTorch · OpenCV</text>
      
      <line x1="14" y1="48" x2="250" y2="48" stroke="#1E293B" stroke-width="1"/>
      
      <text x="14" y="68" class="card-detail">Zero-Shot Visual Classification</text>
      <text x="14" y="86" class="card-detail">Automated Edge Defect Inspection</text>
      <text x="14" y="106" class="font-mono card-metric" fill="#A855F7">Sub-15ms Edge AI Inference</text>
      <text x="14" y="124" class="font-mono" font-size="9.5" fill="#10B981">● ISO 42001 &amp; 25059 Validated</text>
    </g>

  </g>
</svg>
