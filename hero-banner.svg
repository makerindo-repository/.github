<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#10507C"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-corp { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #00ADD8; letter-spacing: 0.2px; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94A3B8; line-height: 1.5; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #F1F5F9; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #64748B; }
    .code-text { font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #38BDF8; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #10B981; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="1050" cy="160" r="180" fill="#00ADD8" opacity="0.08" filter="url(#glowCyan)"/>
  <circle cx="200" cy="80" r="140" fill="#10507C" opacity="0.12" filter="url(#glowCyan)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#primaryAccent)"/>

  <!-- ==================== LEFT COLUMN: BRAND & VALUE PROPOSITION ==================== -->
  <g transform="translate(50, 42)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="230" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#10B981"/>
    <text x="24" y="16" class="badge-text" fill="#94A3B8">ENTERPRISE R&amp;D LAB · EST. 2019</text>

    <!-- Company Name & Slogan -->
    <text x="0" y="62" class="title-corp">PT Makerindo Prima Solusi</text>
    <text x="0" y="88" class="tagline">Build Solution without Exception</text>

    <!-- Mission Scope -->
    <text x="0" y="122" class="desc">Leading IT consultancy and engineering laboratory specializing in Cyber-Physical</text>
    <text x="0" y="142" class="desc">Systems, Industrial IoT Hardware, Distributed Enterprise Cloud, and Applied Vision AI.</text>
    <text x="0" y="162" class="desc">Empowering national defense, precision agriculture, smart industry, and higher education.</text>

    <!-- ISO Governance Chips -->
    <g transform="translate(0, 192)">
      <!-- ISO 25010 -->
      <rect x="0" y="0" width="120" height="26" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="10" y="17" class="code-text">ISO/IEC 25010</text>

      <!-- ISO 27001 -->
      <rect x="130" y="0" width="120" height="26" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="140" y="17" class="code-text">ISO/IEC 27001</text>

      <!-- ISO 12207 -->
      <rect x="260" y="0" width="120" height="26" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="270" y="17" class="code-text">ISO/IEC 12207</text>

      <!-- Location Hub -->
      <g transform="translate(395, 17)">
        <circle cx="0" cy="-3" r="3" fill="#10B981"/>
        <text x="8" y="0" class="status-text">Bandung, West Java, ID</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: 4 ENTERPRISE R&D TIERS ==================== -->
  <g transform="translate(680, 36)">
    <!-- 01: Industrial IoT & Embedded -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="225" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="14" y="14" width="30" height="30" rx="6" fill="#0F172A" stroke="#00ADD8" stroke-width="1"/>
      <!-- Icon Microchip -->
      <path d="M23 23h12v12H23z" fill="none" stroke="#00ADD8" stroke-width="1.5"/>
      <path d="M26 21v2m6-2v2m-6 12v2m6-2v2M21 26h2m-2 6h2m12-6h2m-2 6h2" stroke="#00ADD8" stroke-width="1.5"/>
      
      <text x="54" y="28" class="card-title">IoT &amp; Embedded Hardware</text>
      <text x="54" y="42" class="card-desc">ESP-IDF · STM32 · LoRaWAN · RS-485</text>
      <line x1="14" y1="56" x2="211" y2="56" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="74" class="desc" font-size="11">RSC Soil Checker · Smart Meters</text>
      <text x="14" y="92" class="code-text" font-size="10">Sub-10ms Sensor Telemetry</text>
    </g>

    <!-- 02: Enterprise Cloud Platforms -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="225" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="14" y="14" width="30" height="30" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <!-- Icon Cloud Cluster -->
      <path d="M23 32a5 5 0 0 1 0-10 6 6 0 0 1 11-2 5 5 0 0 1 3 12H23z" fill="none" stroke="#10B981" stroke-width="1.5"/>
      
      <text x="54" y="28" class="card-title">Distributed Cloud &amp; Web</text>
      <text x="54" y="42" class="card-desc">Next.js 16 · Go 1.22 · Postgres · Redis</text>
      <line x1="14" y1="56" x2="211" y2="56" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="74" class="desc" font-size="11">High-Throughput Microservices</text>
      <text x="14" y="92" class="code-text" font-size="10">99.99% Availability Architecture</text>
    </g>

    <!-- 03: Mission-Critical Mobile -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="225" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="14" y="14" width="30" height="30" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <!-- Icon Mobile GPS -->
      <rect x="24" y="21" width="10" height="16" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="29" cy="33" r="1" fill="#F59E0B"/>
      
      <text x="54" y="28" class="card-title">Mission-Critical Mobile</text>
      <text x="54" y="42" class="card-desc">Flutter 3.x · Dart · SQLite DTN</text>
      <line x1="14" y1="56" x2="211" y2="56" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="74" class="desc" font-size="11">Anti-Mock GPS Geofence</text>
      <text x="14" y="92" class="code-text" font-size="10">Store-and-Forward Offline Sync</text>
    </g>

    <!-- 04: Applied AI & Computer Vision -->
    <g transform="translate(245, 130)">
      <rect x="0" y="0" width="225" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="14" y="14" width="30" height="30" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <!-- Icon AI Brain -->
      <path d="M22 28a4 4 0 0 1 4-4 4 4 0 0 1 4 2 4 4 0 0 1 4-2 4 4 0 0 1 4 4c0 3-4 7-8 9-4-2-8-6-8-9z" fill="none" stroke="#A855F7" stroke-width="1.5"/>
      
      <text x="54" y="28" class="card-title">Applied AI &amp; Computer Vision</text>
      <text x="54" y="42" class="card-desc">SigLIP ViT · PyTorch · OpenCV Edge</text>
      <line x1="14" y1="56" x2="211" y2="56" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="74" class="desc" font-size="11">Real-Time Edge Visual Inspection</text>
      <text x="14" y="92" class="code-text" font-size="10">ISO 42001 &amp; 25059 AI Governance</text>
    </g>
  </g>
</svg>
